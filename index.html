<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام حجز الرحلات</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>

    <style>
        :root {
            /* إعدادات الخطوط والألوان */
            --font-en: 'Cairo', sans-serif;
            --font-ar: 'Beirut', sans-serif; /* تأكد من توفر خط بيروت أو سيتم استخدام كايرو كبديل */
            --sky-blue: #87CEEB;
            --deep-blue: #005A9C;
            --cloud-white: #F4F9F9;
            --text-dark: #333333;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-ar), var(--font-en);
            background-color: var(--sky-blue);
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* التحكم بظهور وإخفاء الشاشات */
        .screen { display: none; height: 100vh; width: 100vw; }
        .screen.active { display: flex; }
        .hidden { display: none !important; }

        /* 1. شاشة التحميل */
        #loading-screen {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, var(--deep-blue), var(--sky-blue));
            color: white;
        }
        
        .plane-animation {
            width: 150px;
            animation: fly 2s infinite alternate;
        }

        @keyframes fly {
            0% { transform: translateY(0); }
            100% { transform: translateY(-20px); }
        }

        /* 2. شاشة الدخول والتسجيل */
        .auth-container {
            margin: auto;
            background: var(--cloud-white);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }

        .auth-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .auth-tabs button { flex: 1; padding: 10px; border: none; cursor: pointer; border-radius: 5px; font-family: inherit; font-weight: bold; }
        .auth-tabs button.active { background: var(--deep-blue); color: white; }
        
        .auth-form { display: flex; flex-direction: column; gap: 15px; }
        input { padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; }
        
        .btn-primary {
            background: var(--deep-blue);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
        }
        .note { font-size: 12px; color: #666; text-align: center; }

        /* 3. لوحة التحكم */
        #dashboard-screen { flex-direction: row; }
        
        .sidebar {
            width: 250px;
            background: var(--cloud-white);
            height: 100vh;
            padding: 20px;
            box-shadow: -2px 0 5px rgba(0,0,0,0.1);
        }
        
        .nav-links { list-style: none; padding: 0; margin-top: 30px; }
        .nav-links li { margin-bottom: 15px; }
        .nav-links a { text-decoration: none; color: var(--deep-blue); font-weight: bold; font-size: 18px; }

        .content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* مجسم الأرض 3D */
        .model-container {
            width: 100%;
            height: 400px;
            display: flex;
            justify-content: center;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
        }

        /* بطاقة المستخدم */
        .user-profile-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            width: 80%;
            max-width: 600px;
            margin-top: -30px;
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .user-profile-card h3 { margin-top: 0; color: var(--deep-blue); }
        
        .stats { display: flex; justify-content: space-between; margin-top: 15px; flex-wrap: wrap; gap: 10px; }
        .stat-box { background: var(--sky-blue); padding: 10px; border-radius: 8px; font-weight: bold; flex: 1; text-align: center; }
        .warning { background: #ff7675; color: white; }
    </style>
</head>
<body>

    <div id="loading-screen" class="screen active">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="شعار الطائرة" class="plane-animation">
        <h2>جاري التجهيز للتحليق...</h2>
    </div>

    <div id="auth-screen" class="screen hidden">
        <div class="auth-container">
            <div class="auth-tabs">
                <button onclick="toggleAuth('login')" class="active" id="tab-login">تسجيل دخول</button>
                <button onclick="toggleAuth('signup')" id="tab-signup">إنشاء حساب</button>
            </div>

            <form id="form-login" class="auth-form" onsubmit="handleLogin(event)">
                <input type="tel" placeholder="رقم الجوال" required>
                <input type="password" placeholder="كلمة السر" required>
                <button type="submit" class="btn-primary">دخول</button>
            </form>

            <form id="form-signup" class="auth-form hidden" onsubmit="handleSignup(event)">
                <input type="text" placeholder="اللقب" required>
                <input type="tel" placeholder="رقم الجوال" required>
                <input type="password" placeholder="كلمة السر" required>
                <button type="submit" class="btn-primary">طلب إنشاء حساب</button>
                <p class="note">* سيتم مراجعة طلبك من قبل المشرف قبل التفعيل.</p>
            </form>
        </div>
    </div>

    <div id="dashboard-screen" class="screen hidden">
        
        <aside class="sidebar">
            <ul class="nav-links">
                <li><a href="#tickets">🎫 تذاكر السفر</a></li>
                <li><a href="#packages">🧳 بكجات السفر</a></li>
                <li><a href="#booking">✈️ حجز الرحلات</a></li>
                <li><a href="#visited">📍 أماكن تمت زيارتها</a></li>
            </ul>
        </aside>

        <main class="content">
            
            <div class="model-container">
                <model-viewer src="https://modelviewer.dev/shared-assets/models/Earth.glb" 
                              auto-rotate camera-controls disable-zoom>
                </model-viewer>
            </div>

            <div class="user-profile-card">
                <h3>اللقب: <span id="user-nickname">محمد</span></h3>
                <p>رقم الجوال: <span id="user-phone">0500000000</span></p>
                <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
                <div class="stats">
                    <div class="stat-box">السفرات: <br><span>12</span></div>
                    <div class="stat-box">التذاكر: <br><span>3</span></div>
                    <div class="stat-box warning">الإنذارات: <br><span>0</span></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 1. إزالة شاشة التحميل بعد 3 ثوانٍ وعرض شاشة الدخول
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loading-screen').classList.remove('active');
                document.getElementById('auth-screen').classList.add('active');
            }, 3000); // 3000 ميلي ثانية = 3 ثواني
        });

        // 2. دالة التبديل بين الدخول والتسجيل
        function toggleAuth(type) {
            const loginForm = document.getElementById('form-login');
            const signupForm = document.getElementById('form-signup');
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');
            
            if(type === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                tabLogin.classList.add('active');
                tabSignup.classList.remove('active');
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                tabSignup.classList.add('active');
                tabLogin.classList.remove('active');
            }
        }

        // 3. دالة محاكاة الدخول بنجاح والانتقال للوحة التحكم
        function handleLogin(e) {
            e.preventDefault(); // منع إعادة تحميل الصفحة
            document.getElementById('auth-screen').classList.remove('active');
            document.getElementById('dashboard-screen').style.display = 'flex';
        }

        // 4. دالة محاكاة إرسال طلب إنشاء الحساب
        function handleSignup(e) {
            e.preventDefault();
            alert("تم إرسال طلبك بنجاح. يرجى الانتظار حتى يتم قبوله من المشرف لتتمكن من الدخول.");
            // إرجاع المستخدم لشاشة تسجيل الدخول بعد الطلب
            toggleAuth('login');
        }
    </script>
</body>
</html>
